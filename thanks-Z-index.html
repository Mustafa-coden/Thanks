<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12142B;
    --dusk:#1E2247;
    --dusk-2:#262b57;
    --parchment:#F3ECDD;
    --gold:#D9A448;
    --ember:#C9694B;
    --mist:#8B90B3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, rgba(217,164,72,0.08), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(201,105,75,0.10), transparent 55%),
      var(--ink);
    color:var(--parchment);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }
  .stage{ width:100%; max-width:520px; position:relative; z-index:2; }

  /* ---------- GATE ---------- */
  .gate{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:28px; }
  .seal{
    width:96px; height:96px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e0864f, var(--ember) 60%, #9c4a33 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-size:34px; color:#fff2e4; cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,0.4), inset 0 -6px 10px rgba(0,0,0,0.25), inset 0 4px 8px rgba(255,255,255,0.15);
    transition:transform .35s ease; user-select:none;
  }
  .seal:hover{ transform:scale(1.05) rotate(-3deg); }
  .seal.breaking{ animation:crack .5s ease forwards; }
  @keyframes crack{ 0%{transform:scale(1);} 40%{transform:scale(1.15) rotate(6deg);} 100%{transform:scale(0);opacity:0;} }
  .gate h1{ font-family:'Fraunces', serif; font-weight:500; font-style:italic; font-size:clamp(24px,5vw,32px); }
  .gate p{ color:var(--mist); font-size:14px; max-width:320px; line-height:1.6; }
  .passcode-row{ display:flex; gap:10px; margin-top:6px; }
  input[type="password"], input[type="text"]{
    background:var(--dusk); border:1px solid rgba(217,164,72,0.25); color:var(--parchment);
    font-family:'JetBrains Mono', monospace; letter-spacing:2px; font-size:15px;
    padding:12px 16px; border-radius:8px; outline:none; transition:border-color .2s;
  }
  input[type="password"]{ width:180px; letter-spacing:4px; }
  input[type="password"]:focus, input[type="text"]:focus{ border-color:var(--gold); }
  .unlock-btn{
    background:var(--gold); color:var(--ink); border:none; font-family:'Work Sans', sans-serif;
    font-weight:500; font-size:14px; padding:12px 20px; border-radius:8px; cursor:pointer;
    transition:opacity .2s, transform .2s;
  }
  .unlock-btn:hover{ transform:translateY(-1px); opacity:0.92; }
  .error-msg{ color:var(--ember); font-size:13px; height:16px; }

  /* ---------- CARDS ---------- */
  .cards-wrap{ display:none; }
  .cards-wrap.active{ display:block; }
  .progress{ display:flex; justify-content:center; gap:7px; margin-bottom:26px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--dusk-2); transition:background .3s, transform .3s; }
  .dot.on{ background:var(--gold); transform:scale(1.3); }
  .dot.hidden-dot{ background:transparent; border:1px solid var(--dusk-2); }

  .card{
    background:linear-gradient(160deg, var(--dusk), var(--dusk-2));
    border:1px solid rgba(217,164,72,0.12); border-radius:18px; padding:44px 36px;
    min-height:280px; display:flex; flex-direction:column; justify-content:center; gap:16px;
    position:relative; overflow:hidden; animation:rise .5s ease;
  }
  .card::before{ content:""; position:absolute; top:-40%; right:-20%; width:220px; height:220px;
    background:radial-gradient(circle, rgba(217,164,72,0.10), transparent 70%); }
  @keyframes rise{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); }
  .card p{ font-family:'Fraunces', serif; font-size:clamp(18px,3.6vw,22px); line-height:1.55; color:var(--parchment); position:relative; }
  .card p em{ color:var(--gold); font-style:italic; }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; }
  .nav-btn{
    background:none; border:1px solid rgba(217,164,72,0.3); color:var(--parchment);
    font-family:'Work Sans', sans-serif; font-size:13px; padding:10px 18px; border-radius:24px; cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .nav-btn:hover:not(:disabled){ border-color:var(--gold); background:rgba(217,164,72,0.08); }
  .nav-btn:disabled{ opacity:0.25; cursor:default; }
  .nav-btn.primary{ background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:500; }
  .nav-btn.primary:hover{ opacity:0.9; }

  /* ---------- SCRATCH CARD ---------- */
  .scratch-box{ position:relative; border-radius:12px; overflow:hidden; height:150px; margin-top:6px; }
  .scratch-reveal{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:18px; text-align:center;
    font-family:'Fraunces', serif; font-style:italic; font-size:17px; color:var(--gold);
    background:linear-gradient(160deg, #2a1f47, #1c1436);
  }
  .scratch-canvas{ position:absolute; inset:0; cursor:grab; touch-action:none; }
  .scratch-hint{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--mist); text-align:center; margin-top:10px; }

  /* ---------- FINALE ---------- */
  .finale{ display:none; text-align:center; flex-direction:column; align-items:center; gap:18px; }
  .finale.active{ display:flex; }
  .finale h2{ font-family:'Fraunces', serif; font-weight:500; font-style:italic; font-size:clamp(22px,5vw,28px); color:var(--gold); }
  .finale p{ color:var(--mist); font-size:14px; line-height:1.6; max-width:340px; }
  .reply-box{ width:100%; max-width:360px; display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  .reply-box textarea{
    width:100%; min-height:80px; background:var(--dusk); border:1px solid rgba(217,164,72,0.25);
    color:var(--parchment); font-family:'Work Sans', sans-serif; font-size:14px; padding:12px 14px;
    border-radius:10px; resize:vertical; outline:none;
  }
  .reply-box textarea:focus{ border-color:var(--gold); }
  .copy-btn{
    align-self:flex-end; background:none; border:1px solid rgba(217,164,72,0.3); color:var(--parchment);
    font-size:12.5px; padding:8px 14px; border-radius:20px; cursor:pointer; transition:.2s;
  }
  .copy-btn:hover{ border-color:var(--gold); background:rgba(217,164,72,0.08); }
  .copy-btn.copied{ background:var(--gold); color:var(--ink); border-color:var(--gold); }

  #confettiCanvas{ position:fixed; inset:0; pointer-events:none; z-index:1; }

  @media (max-width:480px){
    .card{ padding:32px 24px; min-height:240px; }
    .passcode-row{ flex-direction:column; align-items:center; }
    input[type="password"]{ width:220px; text-align:center; }
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="stage">

  <!-- GATE -->
  <div class="gate" id="gate">
    <div class="seal" id="seal">✦</div>
    <h1>Before you open this</h1>
    <p>You'll need the little word only you'd know. Break the seal when you're ready.</p>
    <div class="passcode-row">
      <input type="password" id="passInput" maxlength="20" placeholder="passcode" autocomplete="off">
      <button class="unlock-btn" id="unlockBtn">Open</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- CARDS -->
  <div class="cards-wrap" id="cardsWrap">
    <div class="progress" id="progress"></div>
    <div id="cardHost"></div>
    <div class="nav-row" id="navRow">
      <button class="nav-btn" id="backBtn">← Back</button>
      <button class="nav-btn primary" id="nextBtn">Next →</button>
    </div>
  </div>

  <!-- FINALE -->
  <div class="finale" id="finale">
    <div style="font-size:30px;">✦</div>
    <h2>That's everything I wanted to say.</h2>
    <p>If you want, leave a line back — I'll be checking. Type below and copy it, then send it however feels right.</p>
    <div class="reply-box">
      <textarea id="replyText" placeholder="Write something back..."></textarea>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>
  </div>

</div>

<script>
  const PASSCODE = "yaad";

  const gate = document.getElementById('gate');
  const seal = document.getElementById('seal');
  const passInput = document.getElementById('passInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const errorMsg = document.getElementById('errorMsg');
  const cardsWrap = document.getElementById('cardsWrap');
  const cardHost = document.getElementById('cardHost');
  const progress = document.getElementById('progress');
  const navRow = document.getElementById('navRow');
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  const finale = document.getElementById('finale');

  const cards = [
    { type:'text', eyebrow:"01 — first", html:"<p>I don't really know how to say this properly...<br>you made my <em>month</em> with this, not just my day.</p>" },
    { type:'text', eyebrow:"02 — a small correction", html:"<p>My birthday is actually <em>July 15</em>. You weren't far off — and honestly, that you remembered at all says everything.</p>" },
    { type:'text', eyebrow:"03 — the truth of it", html:"<p>Distance and silence don't change what matters. Time knows when is best — <em>Allah knows better than either of us.</em></p>" },
    { type:'text', eyebrow:"04 — for you", html:"<p>Thank you for holding on to me, even quietly.<br>Kaise ho aap? Ghar walon ko meri taraf se salaam. 🤍</p>" },
    { type:'scratch', eyebrow:"05 — one more thing", secret:"I kept every message you ever sent — even the ones I never replied to." }
  ];

  let idx = 0;

  function renderProgress(){
    progress.innerHTML = cards.map((_,i)=>`<span class="dot ${i===idx?'on':''}"></span>`).join('');
  }

  function renderCard(){
    const c = cards[idx];
    if(c.type === 'text'){
      cardHost.innerHTML = `<div class="card"><span class="eyebrow">${c.eyebrow}</span>${c.html}</div>`;
    } else if(c.type === 'scratch'){
      cardHost.innerHTML = `
        <div class="card">
          <span class="eyebrow">${c.eyebrow}</span>
          <div class="scratch-box">
            <div class="scratch-reveal">${c.secret}</div>
            <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
          </div>
          <div class="scratch-hint">scratch the gold away</div>
        </div>`;
      setupScratch();
    }
    backBtn.disabled = idx === 0;
    nextBtn.textContent = idx === cards.length - 1 ? "Finish ✦" : "Next →";
    renderProgress();
  }

  function setupScratch(){
    const canvas = document.getElementById('scratchCanvas');
    const box = canvas.parentElement;
    const ctx = canvas.getContext('2d');
    const resize = () => {
      canvas.width = box.clientWidth;
      canvas.height = box.clientHeight;
      ctx.fillStyle = '#D9A448';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = 'rgba(18,20,43,0.55)';
      for(let i=0;i<40;i++){
        ctx.beginPath();
        ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*10+2, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.font = "600 13px 'Work Sans', sans-serif";
      ctx.fillStyle = '#5c4520';
      ctx.textAlign = 'center';
      ctx.fillText('✦ scratch here ✦', canvas.width/2, canvas.height/2);
    };
    resize();
    let drawing = false;
    const erase = (x,y) => {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(x,y,18,0,Math.PI*2);
      ctx.fill();
    };
    const pos = e => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    };
    canvas.addEventListener('pointerdown', e => { drawing = true; const p = pos(e); erase(p.x,p.y); });
    canvas.addEventListener('pointermove', e => { if(drawing){ const p = pos(e); erase(p.x,p.y); } });
    window.addEventListener('pointerup', () => drawing = false);
  }

  backBtn.addEventListener('click', () => { if(idx>0){ idx--; renderCard(); } });
  nextBtn.addEventListener('click', () => {
    if(idx < cards.length - 1){
      idx++; renderCard();
    } else {
      cardsWrap.classList.remove('active');
      finale.classList.add('active');
      burstConfetti();
    }
  });

  function tryUnlock(){
    if(passInput.value.trim().toLowerCase() === PASSCODE.toLowerCase()){
      errorMsg.textContent = "";
      seal.classList.add('breaking');
      setTimeout(() => {
        gate.style.display = 'none';
        cardsWrap.classList.add('active');
        renderCard();
      }, 400);
    } else {
      errorMsg.textContent = "not quite — try again";
      passInput.value = "";
      passInput.focus();
    }
  }
  unlockBtn.addEventListener('click', tryUnlock);
  passInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });
  seal.addEventListener('click', () => passInput.focus());

  // ---------- copy reply ----------
  const copyBtn = document.getElementById('copyBtn');
  const replyText = document.getElementById('replyText');
  copyBtn.addEventListener('click', () => {
    if(!replyText.value.trim()) return;
    navigator.clipboard.writeText(replyText.value).then(() => {
      copyBtn.textContent = "Copied ✓";
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = "Copy"; copyBtn.classList.remove('copied'); }, 1600);
    });
  });

  // ---------- confetti ----------
  const confettiCanvas = document.getElementById('confettiCanvas');
  const cctx = confettiCanvas.getContext('2d');
  function resizeConfetti(){ confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; }
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();

  function burstConfetti(){
    const colors = ['#D9A448','#C9694B','#F3ECDD','#8B90B3'];
    const particles = Array.from({length:80}, () => ({
      x: confettiCanvas.width/2,
      y: confettiCanvas.height/2,
      vx: (Math.random()-0.5)*10,
      vy: (Math.random()-0.9)*10,
      size: Math.random()*5+3,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: 100
    }));
    function frame(){
      cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
      let alive = false;
      particles.forEach(p => {
        if(p.life <= 0) return;
        alive = true;
        p.vy += 0.15;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1.4;
        cctx.globalAlpha = Math.max(p.life/100, 0);
        cctx.fillStyle = p.color;
        cctx.fillRect(p.x, p.y, p.size, p.size);
      });
      cctx.globalAlpha = 1;
      if(alive) requestAnimationFrame(frame);
      else cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    }
    frame();
  }
</script>

</body>
</html>
